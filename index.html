<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>CM FILINGS Admin</title>

<link rel="icon"
      type="image/png"
      href="assets/logo.png">

<link rel="apple-touch-icon"
      href="assets/logo.png">

<meta name="theme-color"
      content="#FFFFFF">

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://unpkg.com/lucide@latest"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Inter,
        Arial,
        sans-serif;

    background: #F4F5F7;

}


/* =====================================================
   APP
===================================================== */

#app {

    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

}


/* =====================================================
   HEADER
===================================================== */

#app-header {

    height: 72px;

    flex-shrink: 0;

    background:
        rgba(255,255,255,.97);

    border-bottom:
        1px solid #E2E8F0;

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    padding:
        0 16px;

    z-index: 1000;

}


/* LOGO */

.header-brand {

    display: flex;

    align-items: center;

    gap: 10px;

    min-width: 0;

}


.header-logo {

    width: 42px;
    height: 42px;

    object-fit: contain;

    flex-shrink: 0;

}


.header-name {

    height: 28px;

    width: auto;

    object-fit: contain;

    max-width: 150px;

}


/* HEADER ACTIONS */

.header-actions {

    display: flex;

    align-items: center;

    gap: 7px;

}


.header-action {

    width: 42px;
    height: 42px;

    border: 1px solid #E2E8F0;

    background: #F8FAFC;

    border-radius: 12px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #64748B;

    cursor: pointer;

}


.header-action:active {

    transform: scale(.95);

}


/* =====================================================
   MODULE AREA
===================================================== */

#module-container {

    flex: 1;

    min-height: 0;

    position: relative;

    overflow: hidden;

    background: #F4F5F7;

}


#module-frame {

    width: 100%;
    height: 100%;

    border: 0;

    display: block;

}


/* =====================================================
   BOTTOM NAV
===================================================== */

#bottom-nav {

    height: 76px;

    flex-shrink: 0;

    background: #FFFFFF;

    border-top:
        1px solid #E2E8F0;

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    z-index: 1000;

    padding-bottom:
        env(safe-area-inset-bottom);

}


.nav-item {

    border: 0;

    background: transparent;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 4px;

    color: #94A3B8;

    font-size: 10px;

    font-weight: 700;

    cursor: pointer;

}


.nav-item svg {

    width: 22px;
    height: 22px;

}


.nav-item.active {

    color: #B10000;

}


.nav-item.active svg {

    stroke-width: 2.5;

}


/* =====================================================
   SEARCH PANEL
===================================================== */

#global-search {

    position: fixed;

    top: 72px;

    left: 0;
    right: 0;

    background: white;

    border-bottom:
        1px solid #E2E8F0;

    padding: 12px 16px;

    z-index: 900;

    display: none;

}


#global-search.show {

    display: block;

}


.global-search-box {

    display: flex;

    align-items: center;

    gap: 8px;

    background: #F8FAFC;

    border: 1px solid #E2E8F0;

    border-radius: 12px;

    padding:
        0 12px;

}


.global-search-box input {

    width: 100%;

    border: 0;

    outline: 0;

    background: transparent;

    padding: 12px 0;

    font-size: 13px;

    font-weight: 600;

}


/* =====================================================
   MORE MENU
===================================================== */

#more-menu {

    position: fixed;

    left: 12px;
    right: 12px;

    bottom: 84px;

    background: #FFFFFF;

    border:
        1px solid #E2E8F0;

    border-radius: 18px;

    padding: 10px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.15);

    z-index: 2000;

    display: none;

}


#more-menu.show {

    display: block;

}


.more-item {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 13px;

    background: transparent;

    border: 0;

    border-radius: 11px;

    color: #334155;

    font-size: 13px;

    font-weight: 700;

    text-align: left;

}


.more-item:active {

    background: #F8FAFC;

}


@media (min-width: 768px) {

    #app-header {

        padding:
            0 28px;

    }

    #bottom-nav {

        max-width: 760px;

        margin: 0 auto;

        width: 100%;

        border:
            1px solid #E2E8F0;

        border-bottom: 0;

        border-radius:
            18px 18px 0 0;

    }

}

</style>

</head>


<body>


<div id="app">


    <!-- =================================================
         PERMANENT HEADER
    ================================================== -->

    <header id="app-header">


        <div class="header-brand">

            <img
                src="assets/logo.png"
                class="header-logo"
                alt="CM Filings">


            <img
                src="assets/name.svg"
                class="header-name"
                alt="CM FILINGS">

        </div>


        <div class="header-actions">


            <!-- GLOBAL SEARCH -->

            <button
                id="global-search-btn"
                class="header-action"
                title="Search">

                <i
                    data-lucide="search"
                    class="w-5 h-5">
                </i>

            </button>


            <!-- PROFILE -->

            <button
                id="profile-btn"
                class="header-action"
                title="Profile">

                <i
                    data-lucide="user-circle"
                    class="w-5 h-5">
                </i>

            </button>

        </div>

    </header>


    <!-- =================================================
         GLOBAL SEARCH
    ================================================== -->

    <div id="global-search">

        <div class="global-search-box">

            <i
                data-lucide="search"
                class="w-4 h-4 text-slate-400">
            </i>

            <input
                id="global-search-input"
                type="search"
                placeholder="Search this module...">

            <button
                id="close-global-search">

                <i
                    data-lucide="x"
                    class="w-4 h-4">
                </i>

            </button>

        </div>

    </div>


    <!-- =================================================
         MODULE CONTENT
    ================================================== -->

    <main id="module-container">

        <iframe
            id="module-frame"
            src="index.html"
            title="CM Filings Module">
        </iframe>

    </main>


    <!-- =================================================
         MORE MENU
    ================================================== -->

    <div id="more-menu">


        <button
            class="more-item"
            data-page="invoice.html"
            data-title="Invoice">

            <i data-lucide="file-text"></i>

            <span>Invoice</span>

        </button>


        <button
            class="more-item"
            data-page="transactions.html"
            data-title="Transactions">

            <i data-lucide="receipt"></i>

            <span>Transactions</span>

        </button>


        <button
            class="more-item"
            data-page="company.html"
            data-title="Company">

            <i data-lucide="building-2"></i>

            <span>Company</span>

        </button>


        <button
            class="more-item"
            data-page="branch.html"
            data-title="Branch">

            <i data-lucide="git-branch"></i>

            <span>Branch</span>

        </button>


        <button
            class="more-item"
            data-page="bank.html"
            data-title="Bank">

            <i data-lucide="landmark"></i>

            <span>Bank</span>

        </button>


        <button
            class="more-item"
            data-page="reports.html"
            data-title="Reports">

            <i data-lucide="bar-chart-3"></i>

            <span>Reports</span>

        </button>

    </div>


    <!-- =================================================
         PERMANENT BOTTOM NAVIGATION
    ================================================== -->

    <nav id="bottom-nav">


        <button
            class="nav-item active"
            data-page="index.html"
            data-title="Dashboard">

            <i data-lucide="layout-dashboard"></i>

            <span>Dashboard</span>

        </button>


        <button
            class="nav-item"
            data-page="clients.html"
            data-title="Clients">

            <i data-lucide="users"></i>

            <span>Clients</span>

        </button>


        <button
            class="nav-item"
            data-page="compliance.html"
            data-title="Compliance">

            <i data-lucide="clipboard-check"></i>

            <span>Compliance</span>

        </button>


        <button
            class="nav-item"
            data-page="credentials.html"
            data-title="Credentials">

            <i data-lucide="key-round"></i>

            <span>Credentials</span>

        </button>


        <button
            class="nav-item"
            id="more-btn">

            <i data-lucide="menu"></i>

            <span>Menu</span>

        </button>

    </nav>

</div>


<script type="module">

import {
    auth
} from "./firebase-config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";


const frame =
    document.getElementById(
        "module-frame"
    );

const moreBtn =
    document.getElementById(
        "more-btn"
    );

const moreMenu =
    document.getElementById(
        "more-menu"
    );

const globalSearchBtn =
    document.getElementById(
        "global-search-btn"
    );

const globalSearch =
    document.getElementById(
        "global-search"
    );

const closeGlobalSearch =
    document.getElementById(
        "close-global-search"
    );

const globalSearchInput =
    document.getElementById(
        "global-search-input"
    );

const profileBtn =
    document.getElementById(
        "profile-btn"
    );


/* =====================================================
   AUTHENTICATION
===================================================== */

onAuthStateChanged(
    auth,
    (user) => {

        if (!user) {

            window.location.replace(
                "auth.html?error=login_required"
            );

        }

    }
);


/* =====================================================
   LOAD MODULE
===================================================== */

function loadModule(
    page,
    title
) {

    frame.src = page;

    moreMenu.classList.remove(
        "show"
    );

    updateActiveNav(page);

}


/* =====================================================
   ACTIVE NAV
===================================================== */

function updateActiveNav(page) {

    document
        .querySelectorAll(
            ".nav-item[data-page]"
        )
        .forEach(
            item => {

                item.classList.toggle(
                    "active",
                    item.dataset.page === page
                );

            }
        );

}


/* =====================================================
   BOTTOM NAV
===================================================== */

document
    .querySelectorAll(
        ".nav-item[data-page]"
    )
    .forEach(
        item => {

            item.addEventListener(
                "click",
                () => {

                    loadModule(
                        item.dataset.page,
                        item.dataset.title
                    );

                }
            );

        }
    );


/* =====================================================
   MORE
===================================================== */

moreBtn.addEventListener(
    "click",
    () => {

        moreMenu.classList.toggle(
            "show"
        );

    }
);


/* =====================================================
   MORE ITEMS
===================================================== */

document
    .querySelectorAll(
        ".more-item"
    )
    .forEach(
        item => {

            item.addEventListener(
                "click",
                () => {

                    loadModule(
                        item.dataset.page,
                        item.dataset.title
                    );

                }
            );

        }
    );


/* =====================================================
   GLOBAL SEARCH
===================================================== */

globalSearchBtn.addEventListener(
    "click",
    () => {

        globalSearch.classList.add(
            "show"
        );

        globalSearchInput.focus();

    }
);


closeGlobalSearch.addEventListener(
    "click",
    () => {

        globalSearch.classList.remove(
            "show"
        );

        globalSearchInput.value = "";

    }
);


/* =====================================================
   SEARCH INSIDE CURRENT MODULE
===================================================== */

globalSearchInput.addEventListener(
    "input",
    () => {

        const value =
            globalSearchInput.value;

        /*
         * Send search value to the
         * currently loaded module.
         */

        try {

            frame.contentWindow.postMessage(
                {
                    type:
                        "GLOBAL_SEARCH",

                    value:
                        value
                },
                "*"
            );

        }

        catch (error) {

            console.log(
                "Module search unavailable"
            );

        }

    }
);


/* =====================================================
   PROFILE
===================================================== */

profileBtn.addEventListener(
    "click",
    () => {

        loadModule(
            "profile.html",
            "Profile"
        );

    }
);


/* =====================================================
   ICONS
===================================================== */

lucide.createIcons();

</script>

</body>

</html>
