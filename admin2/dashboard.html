<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Dashboard - CM FILINGS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config={
  theme:{extend:{
    colors:{
      brand:{
        red:"#B10000",redhover:"#8A0000",redlight:"#FDF2F2",
        navy:"#071D49",navyhover:"#102A5C",light:"#F4F5F7"
      }
    },
    fontFamily:{sans:["Inter","sans-serif"]}
  }}
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#F4F5F7;color:#334155}
body{
  overflow-y:auto;
  padding-bottom:24px;
  -webkit-font-smoothing:antialiased;
}
.hero-pattern{
  min-height:100vh;
  background-color:#F4F5F7;
  background-image:radial-gradient(rgba(7,29,73,.05) 1px,transparent 1px);
  background-size:28px 28px;
}
.card{background:#fff;border:1px solid #E2E8F0;box-shadow:0 2px 8px rgba(15,23,42,.04)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:640px){
  .dashboard-wrap{padding:16px 12px 28px!important}
}
</style>
</head>

<body>
<div class="hero-pattern">
  <main class="dashboard-wrap max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">

    <!-- MODULE TITLE -->
    <div class="flex items-center justify-between gap-4 mb-6">
      <div>
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl bg-brand-navy text-white flex items-center justify-center shrink-0">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="text-xl sm:text-2xl font-extrabold text-brand-navy tracking-tight">Dashboard</h1>
            <p class="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">
              Executive Overview
            </p>
          </div>
        </div>
      </div>

      <button id="dashboard-refresh"
              class="w-10 h-10 rounded-xl border border-slate-200 bg-white text-slate-500 flex items-center justify-center"
              title="Refresh">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- KPI CARDS -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5 mb-6">

      <div class="card rounded-2xl p-5 flex items-center gap-4">
        <div class="w-14 h-14 bg-amber-50 rounded-2xl flex items-center justify-center text-amber-600 shrink-0">
          <i data-lucide="clock" class="w-7 h-7"></i>
        </div>
        <div>
          <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">Pending Compliance</p>
          <p id="kpi-pending" class="text-3xl font-black text-brand-navy mt-1">0</p>
        </div>
      </div>

      <div class="card rounded-2xl p-5 flex items-center gap-4">
        <div class="w-14 h-14 bg-brand-redlight rounded-2xl flex items-center justify-center text-brand-red shrink-0">
          <i data-lucide="indian-rupee" class="w-7 h-7"></i>
        </div>
        <div>
          <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">Outstanding Dues</p>
          <p id="kpi-dues" class="text-3xl font-black text-brand-red mt-1">₹0</p>
        </div>
      </div>

      <div class="card rounded-2xl p-5 flex items-center gap-4">
        <div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600 shrink-0">
          <i data-lucide="alert-triangle" class="w-7 h-7"></i>
        </div>
        <div>
          <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">Priority Tasks Due</p>
          <p id="kpi-priority" class="text-3xl font-black text-brand-navy mt-1">0</p>
        </div>
      </div>

      <div class="card rounded-2xl p-5 flex items-center gap-4">
        <div class="w-14 h-14 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-600 shrink-0">
          <i data-lucide="users" class="w-7 h-7"></i>
        </div>
        <div>
          <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">Active Clients</p>
          <p id="kpi-active" class="text-3xl font-black text-brand-navy mt-1">0</p>
        </div>
      </div>

    </section>

    <!-- CURRENT MONTH -->
    <section class="card rounded-2xl p-5 sm:p-7 mb-6">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5">
        <div>
          <h2 class="text-lg font-extrabold text-brand-navy flex items-center gap-2">
            <i data-lucide="calendar-days" class="w-5 h-5 text-brand-red"></i>
            Current Month
          </h2>
          <p id="current-month-label" class="text-xs text-slate-400 font-semibold mt-1"></p>
        </div>
        <button id="view-compliance"
                class="px-3 py-2 rounded-xl bg-brand-red text-white text-xs font-bold">
          View Compliance
        </button>
      </div>

      <div id="month-summary" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-slate-50 rounded-xl p-4">
          <p class="text-[9px] font-extrabold text-slate-400 uppercase tracking-widest">Total</p>
          <p id="month-total" class="text-xl font-black text-brand-navy mt-1">0</p>
        </div>
        <div class="bg-amber-50 rounded-xl p-4">
          <p class="text-[9px] font-extrabold text-amber-600 uppercase tracking-widest">Pending</p>
          <p id="month-pending" class="text-xl font-black text-brand-navy mt-1">0</p>
        </div>
        <div class="bg-emerald-50 rounded-xl p-4">
          <p class="text-[9px] font-extrabold text-emerald-600 uppercase tracking-widest">Completed</p>
          <p id="month-completed" class="text-xl font-black text-brand-navy mt-1">0</p>
        </div>
        <div class="bg-brand-redlight rounded-xl p-4">
          <p class="text-[9px] font-extrabold text-brand-red uppercase tracking-widest">Due Soon</p>
          <p id="month-due-soon" class="text-xl font-black text-brand-navy mt-1">0</p>
        </div>
      </div>
    </section>

    <!-- TWO COLUMN CONTENT -->
    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- PRIORITY TABLE -->
      <div class="lg:col-span-2 card rounded-2xl p-5 sm:p-7">
        <div class="flex items-center justify-between gap-3 mb-5">
          <h2 class="text-lg font-extrabold text-brand-navy flex items-center gap-2">
            <i data-lucide="alert-octagon" class="w-5 h-5 text-brand-red"></i>
            Priority Pending Tasks
          </h2>
          <button id="view-all-compliance"
                  class="text-xs font-bold text-brand-red hover:underline">
            View All
          </button>
        </div>

        <div class="table-wrap">
          <table class="w-full text-left text-xs whitespace-nowrap">
            <thead class="bg-slate-50 text-slate-400 uppercase font-extrabold text-[9px] tracking-wider">
              <tr>
                <th class="py-3 px-3">Task</th>
                <th class="py-3 px-3">Client</th>
                <th class="py-3 px-3">Due Date</th>
                <th class="py-3 px-3">Priority</th>
              </tr>
            </thead>
            <tbody id="priority-body" class="divide-y divide-slate-100">
              <tr>
                <td colspan="4" class="py-8 text-center text-slate-400">Loading compliance...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- MONTH SCHEDULE -->
      <div class="card rounded-2xl p-5 sm:p-7">
        <h2 class="text-lg font-extrabold text-brand-navy flex items-center gap-2 mb-5">
          <i data-lucide="calendar" class="w-5 h-5 text-brand-navy"></i>
          Calendar Schedule
        </h2>

        <div class="bg-slate-50 rounded-xl p-4 text-center border border-slate-100 mb-4">
          <p id="schedule-month" class="text-xs font-extrabold text-brand-navy uppercase tracking-widest"></p>
        </div>

        <div id="schedule-list" class="space-y-3">
          <div class="text-xs text-slate-400 text-center py-5">Loading schedule...</div>
        </div>
      </div>

    </section>

    <div id="dashboard-error"
         class="hidden mt-5 p-4 rounded-xl bg-brand-redlight border border-red-200 text-brand-red text-xs font-bold"></div>

  </main>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import {
  collection, onSnapshot, getDoc, doc
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const $ = id => document.getElementById(id);

const pendingEl = $("kpi-pending");
const duesEl = $("kpi-dues");
const priorityEl = $("kpi-priority");
const activeEl = $("kpi-active");

const monthTotalEl = $("month-total");
const monthPendingEl = $("month-pending");
const monthCompletedEl = $("month-completed");
const monthDueSoonEl = $("month-due-soon");
const priorityBody = $("priority-body");
const scheduleList = $("schedule-list");
const errorEl = $("dashboard-error");

let clients = [];
let compliance = [];
let unsubscribeClients = null;
let unsubscribeCompliance = null;

const now = new Date();
const month = now.getMonth();
const year = now.getFullYear();

$("current-month-label").textContent =
  now.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
$("schedule-month").textContent =
  now.toLocaleDateString("en-IN",{month:"long",year:"numeric"});

function showError(message){
  errorEl.textContent = message;
  errorEl.classList.remove("hidden");
}

function safeDate(value){
  if(!value) return null;
  if(typeof value?.toDate === "function") return value.toDate();
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? null : d;
}

function field(obj, ...names){
  for(const n of names){
    if(obj && obj[n] !== undefined && obj[n] !== null && obj[n] !== "")
      return obj[n];
  }
  return "";
}

function isCompleted(item){
  const s = String(field(item,"status","Status","workStatus","paymentStatus")).toLowerCase();
  return ["completed","complete","done","filed","paid"].includes(s);
}

function isPaid(item){
  const s = String(field(item,"paymentStatus","PaymentStatus")).toLowerCase();
  return ["paid","completed"].includes(s);
}

function dueDate(item){
  return safeDate(field(item,"dueDate","DueDate","due_date","deadline","date"));
}

function priorityValue(item){
  return String(field(item,"priority","Priority","priorityStatus","PriorityStatus") || "Normal");
}

function clientName(item){
  return field(item,"clientName","ClientName","client","Client","name","Name") || "—";
}

function taskName(item){
  return field(item,"taskName","TaskName","task","Task","service","Service","filing","Filing","complianceName","ComplianceName") || "Compliance Task";
}

function amountValue(item){
  const raw = field(item,"amount","Amount","dueAmount","DueAmount","outstanding","Outstanding");
  return parseFloat(String(raw).replace(/,/g,"").replace(/[₹\s]/g,"")) || 0;
}

function refresh(){
  const pending = compliance.filter(x => !isCompleted(x));

  const dues = compliance
    .filter(x => !isPaid(x))
    .reduce((sum,x)=>sum+amountValue(x),0);

  const today = new Date(year,month,now.getDate(),0,0,0,0);
  const sevenDays = new Date(today);
  sevenDays.setDate(sevenDays.getDate()+7);

  const priority = pending.filter(x=>{
    const d=dueDate(x);
    return d && d>=today && d<=sevenDays;
  }).sort((a,b)=>(dueDate(a)||0)-(dueDate(b)||0));

  const active = clients.filter(x=>{
    const s=String(field(x,"status","Status")||"").toLowerCase();
    return s==="active" || s==="regular";
  });

  pendingEl.textContent=pending.length;
  duesEl.textContent=`₹${dues.toLocaleString("en-IN",{maximumFractionDigits:0})}`;
  priorityEl.textContent=priority.length;
  activeEl.textContent=active.length;

  const monthItems = compliance.filter(x=>{
    const d=dueDate(x);
    return d && d.getMonth()===month && d.getFullYear()===year;
  });

  const completed = monthItems.filter(isCompleted).length;
  const dueSoon = monthItems.filter(x=>{
    const d=dueDate(x);
    return !isCompleted(x) && d && d>=today && d<=sevenDays;
  }).length;

  monthTotalEl.textContent=monthItems.length;
  monthPendingEl.textContent=monthItems.length-completed;
  monthCompletedEl.textContent=completed;
  monthDueSoonEl.textContent=dueSoon;

  renderPriority(priority);
  renderSchedule(monthItems);
}

function renderPriority(items){
  if(!items.length){
    priorityBody.innerHTML=`
      <tr>
        <td colspan="4" class="py-10 text-center text-slate-400">
          No priority tasks due in the next 7 days.
        </td>
      </tr>`;
    return;
  }

  priorityBody.innerHTML=items.slice(0,10).map(item=>{
    const d=dueDate(item);
    const priority=priorityValue(item);
    let badge="bg-blue-50 text-blue-600";
    if(/urgent|critical/i.test(priority)) badge="bg-red-50 text-brand-red";
    else if(/high/i.test(priority)) badge="bg-amber-50 text-amber-600";

    return `
      <tr>
        <td class="py-3 px-3 font-bold text-brand-navy">${escapeHtml(taskName(item))}</td>
        <td class="py-3 px-3">${escapeHtml(clientName(item))}</td>
        <td class="py-3 px-3 font-mono font-bold text-brand-red">
          ${d ? d.toLocaleDateString("en-IN",{day:"2-digit",month:"2-digit",year:"numeric"}) : "—"}
        </td>
        <td class="py-3 px-3">
          <span class="${badge} px-2 py-1 rounded text-[10px] font-bold">
            ${escapeHtml(priority)}
          </span>
        </td>
      </tr>`;
  }).join("");
}

function renderSchedule(items){
  const groups={};

  items.forEach(item=>{
    const d=dueDate(item);
    if(!d) return;
    const key=d.getDate();
    if(!groups[key]) groups[key]=[];
    groups[key].push(item);
  });

  const days=Object.keys(groups).sort((a,b)=>Number(a)-Number(b));

  if(!days.length){
    scheduleList.innerHTML=`
      <div class="text-xs text-slate-400 text-center py-5">
        No compliance scheduled for this month.
      </div>`;
    return;
  }

  scheduleList.innerHTML=days.slice(0,8).map(day=>{
    const itemsForDay=groups[day];
    const first=itemsForDay[0];
    const d=dueDate(first);
    const isSoon=d && d>=new Date(year,month,now.getDate()) &&
      d<=new Date(year,month,now.getDate()+7);

    return `
      <div class="flex items-center justify-between gap-3 p-3 rounded-xl border border-slate-100 ${isSoon?"bg-brand-red/5":"bg-slate-50"}">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-lg ${isSoon?"bg-brand-red":"bg-brand-navy"} text-white flex items-center justify-center font-bold text-xs shrink-0">
            ${day}
          </div>
          <div class="min-w-0">
            <p class="text-xs font-bold text-brand-navy truncate">${escapeHtml(taskName(first))}</p>
            <p class="text-[10px] text-slate-400">${itemsForDay.length} filing${itemsForDay.length===1?"":"s"} scheduled</p>
          </div>
        </div>
        <span class="text-[10px] font-bold ${isSoon?"text-brand-red":"text-slate-500"} shrink-0">
          ${isSoon?"Due Soon":"Upcoming"}
        </span>
      </div>`;
  }).join("");
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function goCompliance(){
  window.parent.postMessage({type:"CM_LOAD_MODULE",page:"compliance.html"},"*");
}

$("view-compliance").addEventListener("click",goCompliance);
$("view-all-compliance").addEventListener("click",goCompliance);
$("dashboard-refresh").addEventListener("click",()=>refresh());

onAuthStateChanged(auth, async user=>{
  if(!user){
    window.parent.location.replace("signin.html?error=login_required");
    return;
  }

  try{
    const roleSnap=await getDoc(doc(db,"users",user.uid));
    const role=roleSnap.exists() ? String(roleSnap.data().role||"").toLowerCase() : "";
    if(role!=="admin"){
      window.parent.location.replace("signin.html?error=admin_required");
      return;
    }

    unsubscribeClients = onSnapshot(
      collection(db,"clients"),
      snap=>{
        clients=snap.docs.map(d=>({id:d.id,...d.data()}));
        refresh();
      },
      err=>{
        console.error(err);
        showError("Unable to read Clients. Check your Firestore rules.");
      }
    );

    unsubscribeCompliance = onSnapshot(
      collection(db,"compliances"),
      snap=>{
        compliance=snap.docs.map(d=>({id:d.id,...d.data()}));
        refresh();
      },
      err=>{
        console.error(err);
        showError("Unable to read Compliance. Check your Firestore rules and collection name.");
      }
    );

  }catch(err){
    console.error("Dashboard authorization error:",err);
    window.parent.location.replace("signin.html?error=authentication_error");
  }
});

window.addEventListener("message",event=>{
  if(event.data?.type==="GLOBAL_SEARCH"){
    const q=String(event.data.value||"").toLowerCase();
    document.querySelectorAll("tbody tr").forEach(row=>{
      row.style.display=!q || row.textContent.toLowerCase().includes(q) ? "" : "none";
    });
  }
});

lucide.createIcons();
</script>
</body>
</html>
