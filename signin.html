<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CM FILINGS Admin</title>
    
    <!-- PWA & Favicon Assets -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#071D49">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#B10000',
                            redhover: '#8A0000',
                            redlight: '#FDF2F2',
                            navy: '#071D49',
                            navyhover: '#102a5c',
                            light: '#F4F5F7',
                            white: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }
        .hero-pattern {
            background-color: #F4F5F7;
            background-image: radial-gradient(rgba(7, 29, 73, 0.05) 1px, transparent 1px);
            background-size: 28px 28px;
        }
    </style>
</head>
<body class="font-sans text-slate-700 bg-brand-light antialiased selection:bg-brand-redlight selection:text-brand-red flex flex-col min-h-screen">

    <!-- MAIN LOGIN CONTAINER -->
    <div class="flex-1 hero-pattern flex flex-col items-center justify-center p-4 min-h-screen">
        <div class="bg-white p-8 md:p-12 rounded-3xl shadow-xl border border-slate-200 w-full max-w-md">
            
            <div class="flex flex-col items-center mb-8 text-center">
                <div class="w-14 h-14 bg-brand-navy rounded-2xl flex items-center justify-center text-white shadow-sm mb-4">
                    <i data-lucide="shield-check" class="w-7 h-7"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-brand-navy tracking-tight">CM FILINGS</h1>
                <p class="text-[10px] font-bold text-brand-red uppercase tracking-widest mt-1">Secure Portal Sign In</p>
            </div>

            <!-- Error Notification Banner -->
            <div id="auth-error" class="hidden bg-brand-redlight text-brand-red text-xs font-bold p-3 rounded-xl border border-brand-red/20 mb-5 text-center"></div>
            
            <!-- Success Notification Banner -->
            <div id="auth-success" class="hidden bg-emerald-50 text-emerald-600 text-xs font-bold p-3 rounded-xl border border-emerald-200 mb-5 text-center"></div>

            <!-- SIGN IN FORM -->
            <form id="signin-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Admin Email</label>
                    <input type="email" id="signin-email" required class="w-full px-4 py-3.5 rounded-xl border border-slate-300 focus:border-brand-navy outline-none transition-all bg-slate-50 font-medium text-slate-800 text-sm" placeholder="admin@cmfilings.com">
                </div>
                
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Password</label>
                        <button type="button" id="btn-forgot-trigger" class="text-xs font-bold text-brand-red hover:underline">Forgot password?</button>
                    </div>
                    <!-- Password Input Container with View Icon Toggle -->
                    <div class="relative">
                        <input type="password" id="signin-password" required class="w-full px-4 py-3.5 pr-12 rounded-xl border border-slate-300 focus:border-brand-navy outline-none transition-all bg-slate-50 font-medium text-slate-800 text-sm" placeholder="••••••••">
                        <button type="button" id="btn-toggle-password" class="absolute right-3.5 top-3.5 text-slate-400 hover:text-slate-600 transition-colors" title="Toggle Password Visibility">
                            <i data-lucide="eye" id="eye-icon" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="w-full py-4 bg-brand-red text-white font-bold rounded-xl shadow-[0_8px_20px_rgb(177,0,0,0.2)] hover:bg-brand-redhover transition-colors flex items-center justify-center gap-2 mt-2 text-sm">
                    <i data-lucide="log-in" class="w-5 h-5"></i> Sign In to Dashboard
                </button>
            </form>
        </div>

        <div class="mt-8 text-center text-xs font-medium text-slate-400">
            &copy; 2026 CM Filings. All rights reserved.
        </div>
    </div>

    <!-- FORGOT PASSWORD MODAL -->
    <div id="forgot-modal" class="hidden fixed inset-0 bg-brand-navy/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl border border-slate-200 animate-in zoom-in-95 duration-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-brand-navy">Reset Password</h3>
                <button id="btn-close-modal" class="text-slate-400 hover:text-brand-red"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <p class="text-xs text-slate-500 mb-5 leading-relaxed">Enter your registered admin email address below, and we will send you a secure password reset link.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Email Address</label>
                    <input type="email" id="reset-email" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-xs outline-none bg-slate-50 font-medium" placeholder="name@cmfilings.com">
                </div>
                <button type="button" id="btn-send-reset" class="w-full py-3.5 bg-brand-navy text-white font-bold rounded-xl shadow-md hover:bg-brand-navyhover transition-colors flex items-center justify-center gap-2 text-xs">
                    Send Reset Link
                </button>
            </div>
        </div>
    </div>

    <!-- FIREBASE & AUTH LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXyKSTlmlzkYnH2LW408cVVWV1CPvlfBo",
            authDomain: "cmfilings-6a37c.firebaseapp.com",
            projectId: "cmfilings-6a37c",
            storageBucket: "cmfilings-6a37c.firebasestorage.app",
            messagingSenderId: "138705123778",
            appId: "1:138705123778:web:9561bff9f0f5d89bb6fe5b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        lucide.createIcons();

        const signinForm = document.getElementById('signin-form');
        const inputEmail = document.getElementById('signin-email');
        const inputPassword = document.getElementById('signin-password');
        const btnSubmit = document.getElementById('btn-submit');
        const authError = document.getElementById('auth-error');
        const authSuccess = document.getElementById('auth-success');

        const btnTogglePassword = document.getElementById('btn-toggle-password');
        const eyeIcon = document.getElementById('eye-icon');

        const forgotModal = document.getElementById('forgot-modal');
        const btnForgotTrigger = document.getElementById('btn-forgot-trigger');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const resetEmail = document.getElementById('reset-email');
        const btnSendReset = document.getElementById('btn-send-reset');

        // Check if already signed in, auto-redirect to home/generator
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "index.html";
            }
        });

        // Toggle Password Visibility (View Icon)
        btnTogglePassword.addEventListener('click', () => {
            if (inputPassword.type === 'password') {
                inputPassword.type = 'text';
                btnTogglePassword.innerHTML = `<i data-lucide="eye-off" class="w-5 h-5"></i>`;
            } else {
                inputPassword.type = 'password';
                btnTogglePassword.innerHTML = `<i data-lucide="eye" class="w-5 h-5"></i>`;
            }
            lucide.createIcons();
        });

        // Sign In Form Submission
        signinForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = inputEmail.value.trim();
            const password = inputPassword.value;

            const originalText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Authenticating...`;
            authError.classList.add('hidden');
            authSuccess.classList.add('hidden');
            lucide.createIcons();

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Successful auth triggers onAuthStateChanged redirect
            } catch (err) {
                console.error("Auth error:", err);
                authError.textContent = "Access Denied: Invalid email or password.";
                authError.classList.remove('hidden');
                btnSubmit.innerHTML = originalText;
                lucide.createIcons();
            }
        });

        // Forgot Password Modal Triggers
        btnForgotTrigger.addEventListener('click', () => {
            resetEmail.value = inputEmail.value; // prefill if typed
            forgotModal.classList.remove('hidden');
        });

        btnCloseModal.addEventListener('click', () => forgotModal.classList.add('hidden'));

        // Send Password Reset Email Handler
        btnSendReset.addEventListener('click', async () => {
            const email = resetEmail.value.trim();
            if(!email) {
                alert("Please enter your email address.");
                return;
            }

            const originalText = btnSendReset.innerHTML;
            btnSendReset.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin inline"></i> Sending...`;
            lucide.createIcons();

            try {
                await sendPasswordResetEmail(auth, email);
                forgotModal.classList.add('hidden');
                authSuccess.textContent = "Password reset link sent! Check your inbox.";
                authSuccess.classList.remove('hidden');
            } catch (err) {
                console.error("Reset error:", err);
                alert("Failed to send reset email. Verify the email address.");
            } finally {
                btnSendReset.innerHTML = originalText;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
